# 相关性阈值（0~1），可以根据实际检索效果调优
score_threshold: 0.3

# 最终返回给上层的证据数量
k: 5

# 多路召回时每一路返回的候选数量
candidate_k: 8

# rerank返回的候选数量
rerank_top_k: 8

# 文档的相关性得分
relevance_score: 0.45

# 低置信度判断
low_confidence_min_evidence: 2
low_confidence_avg_score: 0.55

# 是否启用轻量 retry
enable_agentic_retry: true

# query 变体数量上限
max_query_variants: 6
