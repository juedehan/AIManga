  target_character: 青灵
  required_scene: daily
  required_attributes: [衣着, 发型, 外貌]
  gold_spans:
    - 最惹眼的莫过于青灵，她穿着款式最普通的浅蓝色分体比基尼，身材饱满，曲线毕露，长腿惹眼。
